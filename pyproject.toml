[project]
name = "claude-news-digest"
version = "0.1.0"
description = "RSS/Atom feeds → de-duplicated → a Claude-written daily digest in Markdown"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Sameer Hussain" }]
dependencies = ["anthropic>=2.8", "pydantic>=2", "feedparser>=6", "pyyaml>=6"]

[project.scripts]
news-digest = "news_digest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_digest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
